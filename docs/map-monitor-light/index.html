<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图监控 · 明亮蓝白</title>
<style>
:root{--bg:#F4F6FA;--surface:#fff;--sidebar:#17263D;--text:#1B2B43;--muted:#66758B;--blue:#2563EB;--soft:#EAF1FE;--nav-text:#91A1BA}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:var(--text)}button{font:inherit;border:0;cursor:pointer;background:none;color:inherit;padding:0}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:hover{filter:brightness(.94)}#canvas{position:absolute;width:1280px;height:720px;display:flex;transform-origin:top left;background:var(--bg);overflow:hidden}.sidebar{width:196px;flex:none;background:var(--sidebar);padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--nav-text);transition:width .2s,padding .2s}.brand{height:44px;display:flex;align-items:center;gap:10px;flex:none;color:#E9F0FB;font-size:18px;font-weight:700;white-space:nowrap}.brand img{width:26px;height:26px}.menu{width:100%;height:42px;flex:none;padding:0 12px;display:flex;align-items:center;gap:12px;font-size:13px;text-align:left;white-space:nowrap}.menu img{width:18px;height:18px;flex:none}.menu span{flex:1}.menu .arrow{width:12px;height:12px}.menu.parent{color:#E9F0FB}.menu.sub{height:40px;padding:0 0 0 28px;gap:10px}.menu.sub img{width:16px;height:16px}.menu.selected{background:#203861;color:#AFC9FF;border-radius:10px;padding-right:12px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:60px;flex:none;background:var(--surface);display:flex;align-items:center;gap:20px;padding:0 24px}.icon-button{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center}.icon-button img{width:24px;height:24px}.breadcrumb{display:flex;align-items:center;gap:12px;flex:1;font-size:13px;color:var(--muted);height:24px}.breadcrumb .slash{color:#A9B4C5}.breadcrumb strong{font-weight:500;color:var(--text)}.user{display:flex;align-items:center;gap:10px;width:108px;flex:none;height:36px;font-size:13px;font-weight:500}.user img{width:32px;height:32px;border-radius:16px}.tabs{height:40px;display:flex;align-items:center;gap:8px;padding-left:24px;background:#EDF1F6;flex:none}.tab{height:28px;width:58px;border-radius:7px;background:var(--surface);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}.tab.current{width:112px;gap:10px;background:#DFEAFE;color:var(--blue);font-weight:500}.tab.current img{width:12px;height:12px}.content{flex:1;min-height:0;padding:24px;display:flex;flex-direction:column;gap:24px}.metrics{display:flex;gap:16px;height:100px;flex:none}.metric{flex:1;min-width:0;border-radius:16px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px}.metric:last-child{background:var(--soft)}.metric-label{height:20px;font-size:13px;line-height:20px;color:var(--muted)}.metric-value{height:34px;line-height:34px;font-family:Inter,Arial,sans-serif;font-weight:600;font-size:28px;letter-spacing:-.6px}.metric-value.blue{color:var(--blue)}.charts{flex:1;min-height:0;display:flex;gap:20px}.chart{position:relative;border-radius:16px;background:var(--surface);overflow:hidden}.position-chart{width:630px;flex:none}.mileage-chart{flex:1;min-width:0}.chart-text{position:absolute;margin:0;line-height:24px;white-space:nowrap}.position-title{left:24px;top:22px;font-size:16px;font-weight:500}.hint{left:224px;top:25px;font-size:12px;line-height:20px;color:var(--muted)}.mileage-title{left:20px;top:22px;font-size:14px;font-weight:500}.legend{position:absolute;top:61px;height:20px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.legend i{width:7px;height:7px;border-radius:50%;display:block}.legend[aria-pressed=false]{opacity:.35}.axis-label,.tick{position:absolute;color:var(--muted);font-size:12px;line-height:18px;white-space:nowrap}.tick{font-family:Inter,Arial,sans-serif}.lat-tick{left:16px;width:48px;text-align:right}.lon-tick{top:374px;width:50px;text-align:center}.vehicle-label{left:16px;width:82px;text-align:right;font-family:inherit}.mileage-tick{top:392px;width:28px;text-align:center}.plot{position:absolute;left:72px;top:112px;width:510px;height:252.2px;border:0}.bar-plot{position:absolute;left:108px;top:80px;width:254px;height:300px}#toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:white;font-size:13px;padding:10px 20px;border-radius:8px;z-index:10;max-width:600px;display:none}#tooltip{position:absolute;display:none;background:white;box-shadow:0 4px 20px #17263d26;border:1px solid #E4E9F1;border-radius:8px;padding:12px;z-index:20;font-size:12px;line-height:22px;pointer-events:none}.collapsed .sidebar{width:72px;padding:16px 8px}.collapsed .brand{justify-content:center}.collapsed .brand span,.collapsed .menu span,.collapsed .arrow{display:none}.collapsed .menu,.collapsed .menu.sub{padding:0;justify-content:center}.collapsed .position-chart{width:630px}.hidden-sub{display:none!important}
</style></head>
<body><div id="canvas"><aside class="sidebar" aria-label="主导航">

</aside><main class="main"><header class="topbar"><button class="icon-button" id="collapse" aria-label="收起侧栏" aria-expanded="true"><img src="assets/svg/379_393-20261101_223041081.svg" alt=""></button><nav class="breadcrumb" aria-label="面包屑"><span>首页</span><span class="slash">/</span><span>监控预警</span><span class="slash">/</span><strong>地图监控</strong></nav><button class="icon-button" id="fullscreen" aria-label="切换全屏"><img src="assets/svg/379_395-20261101_223041442.svg" alt=""></button><div class="user"><img src="assets/svg/379_429-20261101_223041560.svg" alt="管理员头像"><span>管理员</span></div><button class="icon-button" id="settings" aria-label="设置"><img src="assets/svg/379_397-20261101_223041808.svg" alt=""></button></header>
<nav class="tabs" aria-label="页面标签"><button class="tab" id="home-tab">首页</button><div class="tab current"><span>地图监控</span><button id="close-tab" aria-label="关闭地图监控标签"><img src="assets/svg/379_435-20261101_223042026.svg" alt=""></button></div></nav>
<section class="content" aria-label="监控数据"><div class="metrics"><article class="metric"><div class="metric-label">车辆总数</div><div class="metric-value">1,936</div></article><article class="metric"><div class="metric-label">在线率</div><div class="metric-value blue">84%</div></article><article class="metric"><div class="metric-label">充电车辆数</div><div class="metric-value blue">387</div></article><article class="metric"><div class="metric-label">总行驶里程(km)</div><div class="metric-value">33,188,999</div></article></div>
<div class="charts"><section class="chart position-chart" aria-labelledby="position-title"><h2 class="chart-text position-title" id="position-title">全场车辆位置分布</h2><span class="chart-text hint">点击车辆查看详情</span>
<button class="legend" style="left:24px" data-color="#79BD85" aria-pressed="true"><i style="background:#79BD85"></i>在线</button><button class="legend" style="left:95px" data-color="#6EA4FF" aria-pressed="true"><i style="background:#6EA4FF"></i>充电中</button><button class="legend" style="left:177px" data-color="#E3828B" aria-pressed="true"><i style="background:#E3828B"></i>告警</button><button class="legend" style="left:248px" data-color="#7E8B9F" aria-pressed="true"><i style="background:#7E8B9F"></i>离线</button>
<span class="axis-label" style="left:26px;top:84px">纬度</span><span class="axis-label" style="left:320px;top:402px">经度</span>
<object class="plot" id="scatter" type="image/svg+xml" data="assets/svg/379_466-20261101_223042296.svg" aria-label="车辆经纬度位置散点图"><img src="assets/svg/379_466-20261101_223042296.svg" alt="车辆位置散点图" width="510" height="252"></object><div id="lat-ticks"></div><div id="lon-ticks"></div></section>
<section class="chart mileage-chart" aria-labelledby="mileage-title"><h2 class="chart-text mileage-title" id="mileage-title">按车辆类型统计行驶里程（万 km）</h2><img class="bar-plot" src="assets/svg/379_482-20261101_223042439.svg" alt="十种车辆类型的行驶里程条形图"><div id="vehicle-labels"></div><div id="mileage-ticks"></div></section></div></section></main><div id="toast" role="status"></div><div id="tooltip" role="status"></div></div>
<script>
const canvas=document.getElementById('canvas');function resize(){const s=Math.min(innerWidth/1280,innerHeight/720);canvas.style.transform=`scale(${s})`;canvas.style.left=(innerWidth-1280*s)/2+'px';canvas.style.top=(innerHeight-720*s)/2+'px'}addEventListener('resize',resize);resize();
function tick(parent,text,cls,x,y){const e=document.createElement('span');e.className='tick '+cls;e.textContent=text;if(x!==null)e.style.left=x+'px';if(y!==null)e.style.top=y+'px';document.getElementById(parent).append(e)}
['40.095','40.090','40.085','40.080','40.075','40.070','40.065'].forEach((v,i)=>tick('lat-ticks',v,'lat-tick',null,103+i*42.033));['116.57','116.58','116.59','116.6','116.61','116.62','116.63'].forEach((v,i)=>tick('lon-ticks',v,'lon-tick',47+i*85,null));['牵引车','行李传送车','客梯车','除冰车','飞机引导车','升降平台车','摆渡车','勤务车','行李牵引车','加水车'].forEach((v,i)=>tick('vehicle-labels',v,'vehicle-label',null,86+i*30));[0,30,60,90,120,150,180].forEach((v,i)=>tick('mileage-ticks',v,'mileage-tick',94+i*42.333,null));
let timer;function notice(message){const t=document.getElementById('toast');t.textContent=message;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',3000)}
document.getElementById('collapse').onclick=function(){const closed=canvas.classList.toggle('collapsed');this.setAttribute('aria-expanded',String(!closed));this.setAttribute('aria-label',closed?'展开侧栏':'收起侧栏')};document.getElementById('monitor-toggle').onclick=function(){const open=this.getAttribute('aria-expanded')!=='true';this.setAttribute('aria-expanded',String(open));document.querySelectorAll('.menu.sub').forEach(e=>e.classList.toggle('hidden-sub',!open));this.querySelector('.arrow').style.transform=open?'none':'rotate(180deg)'};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){notice('当前预览环境不支持全屏')}};document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{if(e.dataset.page==='地图监控'){document.querySelectorAll('.menu').forEach(m=>m.classList.toggle('selected',m===e));return}notice(e.dataset.page+'未包含在本次设计稿中')});document.getElementById('home-tab').onclick=()=>notice('本次预览仅包含地图监控页面');document.getElementById('close-tab').onclick=()=>notice('当前为唯一预览页面，已保留地图监控标签');document.getElementById('settings').onclick=()=>notice('本次预览未连接后台设置');
const scatter=document.getElementById('scatter');function circles(){try{return Array.from(scatter.contentDocument?.querySelectorAll('ellipse,circle')||[])}catch(e){return []}}document.querySelectorAll('.legend').forEach(b=>b.onclick=()=>{const active=b.getAttribute('aria-pressed')!=='true';const list=circles();if(!list.length){notice('当前浏览器暂不支持图例筛选');return}b.setAttribute('aria-pressed',String(active));list.filter(e=>(e.getAttribute('fill')||'').toUpperCase()===b.dataset.color).forEach(e=>e.style.opacity=active?'1':'0')});scatter.addEventListener('load',()=>{circles().forEach(e=>{e.style.cursor='pointer';e.addEventListener('click',()=>{const fill=(e.getAttribute('fill')||'').toUpperCase();const status={'#79BD85':'在线','#6EA4FF':'充电中','#E3828B':'告警','#7E8B9F':'离线'}[fill]||'车辆';notice(status+'车辆位置示意；车辆编号与详情需接入真实数据')})})});
</script></body></html>
